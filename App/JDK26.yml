name: Java CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up OpenJDK 26
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'temurin' # Installs Eclipse Temurin OpenJDK
          
      - name: Verify Java Version
        run: java -version